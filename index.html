<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOM Manipulation Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:700px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.profile{
    text-align:center;
    margin-bottom:20px;
}

img{
    width:150px;
    border-radius:50%;
    margin-bottom:15px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

button{
    padding:12px;
    border:none;
    background:#007BFF;
    color:white;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="container">

    <h1 id="title">DOM Manipulation Example</h1>

    <div class="profile">

        <img id="profilePic"
        src="https://via.placeholder.com/150"
        alt="Profile">

        <h2 id="name">Juan Dela Cruz</h2>

        <p id="course">
            BS Information Technology
        </p>

    </div>

    <div class="buttons">

        <button onclick="changeContent()">
            Change Content
        </button>

        <button onclick="changeStyle()">
            Change Style
        </button>

        <button onclick="changeImage()">
            Change Image
        </button>

        <button onclick="showSkills()">
            Show Skills
        </button>

    </div>

</div>

<script>

// DOM Manipulation: changes the text content of HTML elements using innerHTML
function changeContent(){

    document.getElementById("name").innerHTML =
    "Mary Camille D. Rabang";

    document.getElementById("course").innerHTML =
    "Instructor I - BSIT";

}

// DOM Manipulation: changes the inline style of an element
function changeStyle(){

    const title = document.getElementById("title");

    title.style.color = "blue";
    title.style.fontSize = "40px";
    title.style.textDecoration = "underline";

}

// DOM Manipulation: changes an HTML attribute value
function changeImage(){f

    document.getElementById("profilePic").src =
    "https://picsum.photos/200";

}

// DOM Manipulation: inserts HTML content into an element with innerHTML
function showSkills(){

    document.getElementById("course").innerHTML = `
        <h3>Skills</h3>
        <ul style="text-align:left; margin-left:40px;">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>PHP</li>
            <li>Laravel</li>
        </ul>
    `;

}

</script>

</body>
</html>
